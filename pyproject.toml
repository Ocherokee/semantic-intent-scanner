[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-intent-scanner"
version = "1.0.0"
description = "Invariant-grounded semantic evaluation for AI agent skill files and remote content"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
]

[project.optional-dependencies]
test = ["jsonschema>=4.18"]

[project.scripts]
semantic-intent = "scanner.cli:main"

[project.urls]
Repository = "https://github.com/Ocherokee/semantic-intent-scanner"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

[tool.pytest.ini_options]
markers = [
    "live_model: exercises a live Anthropic model; excluded from the deterministic release gate",
]
